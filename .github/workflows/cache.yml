name: Cache repos
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch repos
        env: USER: Caerii
        run: |
          curl -s "https://api.github.com/users/$USER/repos?per_page=100&sort=updated" > repos_raw.json
          # stitch topics
          node -e '
            (async () => {
              const fs = require("fs");
              const repos = JSON.parse(fs.readFileSync("repos_raw.json","utf8"));
              const fetch = (...a)=>import("node-fetch").then(({default:f})=>f(...a));
              for (const r of repos) {
                const t = await fetch(r.topics_url, {headers: {"Accept":"application/vnd.github+json"}});
                const j = await t.json();
                r.topics = j.names || [];
              }
              fs.writeFileSync("repos.json", JSON.stringify(repos, null, 2));
            })();
          '
      - name: Commit
        run: |
          git config user.name "pages-bot"
          git config user.email "pages-bot@users.noreply.github.com"
          git add repos.json
          git commit -m "update repos cache" || echo "no changes"
          git push
